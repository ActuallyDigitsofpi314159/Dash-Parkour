function createInvite(slot,opts){
slot=slot&7;
opts=opts||{};
return myCert().then(function(cert){
var pc=newPc(cert);
var ch=pc.createDataChannel("dash",{ordered:true});
ch.__buf=[];
ch.onmessage=function(e){ch.__buf.push(e);};
return pc.createOffer().then(function(offer){
var fp=parseSdp(offer.sdp).fp;
return setLocalWithCreds(pc,offer,slot,fp);
}).then(function(explicit){
return waitIce(pc,4000).then(function(){
var sdp=pc.localDescription.sdp;
return{pc:pc,channel:ch,code:packCode(0,slot,sdp,explicit,opts.noRawLocal ? "public":"all"),rawLocal:/typ host/.test(sdp)&&parseSdp(sdp).cands.some(function(c){return c.type==="host"&&ip4bytes(c.addr);})};
});
});
});
}
function acceptInvite(code){
var info;
try{info=unpackCode(code);}catch(e){return Promise.reject(e);}
if(info.kind!==0)return Promise.reject(new Error("That is a reply code. Paste the host's invite code here."));
return myCert().then(function(cert){
var pc=newPc(cert);
var chP=new Promise(function(res){
pc.ondatachannel=function(e){
var c=e.channel;
c.__buf=[];
c.onmessage=function(ev){c.__buf.push(ev);};
res(c);
};
});
return pc.setRemoteDescription({type:"offer",sdp:buildSdp(info,"actpass")}).then(function(){
keepTrying(pc,info.cands,15*60*1000);
return pc.createAnswer();
}).then(function(ans){
var fp=parseSdp(ans.sdp).fp;
return setLocalWithCreds(pc,ans,info.slot,fp);
}).then(function(explicit){
return waitIce(pc,4000).then(function(){
var sdp=pc.localDescription.sdp,mine=parseSdp(sdp).cands,myPub=null,theirPub=null,theirLocal=false;
mine.forEach(function(c){if(c.type==="srflx"&&!myPub)myPub=c.addr;});
info.cands.forEach(function(c){if(c.type==="srflx")theirPub=c.addr;else theirLocal=true;});
var localToo=theirLocal||!theirPub||!myPub||myPub===theirPub;
var they6=info.cands.some(function(c){return c.addr.indexOf(":")>=0;});
return{pc:pc,channelPromise:chP,slot:info.slot,fixes:info.fixes,fixedCode:info.code,code:packCode(1,info.slot,sdp,explicit,localToo ? "all":"public",!they6)};
});
});
});
}
function acceptReply(pc,slot,code){
var info;
try{info=unpackCode(code);}catch(e){return Promise.reject(e);}
if(info.kind!==1)return Promise.reject(new Error("That is an invite code. Paste the other player's reply code here."));
if(info.slot!==(slot&7))return Promise.reject(new Error("That reply belongs to a different invite. Use the reply made from the invite shown here."));
if(pc.signalingState!=="have-local-offer")return Promise.reject(new Error("This invite was already used. Press NEW CODE, send the new invite, and use the reply made from it."));
return pc.setRemoteDescription({type:"answer",sdp:buildSdp(info,"active")}).then(function(){
keepTrying(pc,info.cands,50*1000);
return{fixes:info.fixes,fixedCode:info.code};
});
}

createInvite:createInvite,
acceptInvite:acceptInvite,
acceptReply:acceptReply,
_pack:packCode,

unlockLocal:function(){

st.getTracks().forEach(function(t){t.stop();});
return true;
},function(){return false;});
},
report:function(pc,myCode,theirCode){
var lines=["DASH net report",navigator.userAgent];
var desc=function(label,code){
try{
var r=unpackCode(code);
lines.push(label + ": " + r.cands.map(function(c){return c.type + "/" +(/\.local$/.test(c.addr)? "mdns":c.addr.indexOf(":")>=0 ? "ipv6":/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(c.addr)? "lan4":"ipv4")+ ":" + c.port;}).join(" ")+(r.explicit ? " explicit":""));
}catch(e){lines.push(label + ": unreadable");}
};
desc("mine",myCode);
desc("theirs",theirCode);
if(pc&&pc.localDescription){
lines.push("all mine: " + parseSdp(pc.localDescription.sdp).cands.map(function(c){return c.type + "/" +(/\.local$/.test(c.addr)? "mdns":c.addr.indexOf(":")>=0 ? "v6":"v4")+ "@" + c.pri;}).join(" "));
}
if(!pc||!pc.getStats)return Promise.resolve(lines.join("\n"));
lines.push("states: " + pc.signalingState + " " + pc.iceGatheringState + " " + pc.iceConnectionState + " " + pc.connectionState);
if(pc.__log)lines.push("timeline: " + pc.__log.join(" | "));
return pc.getStats().then(function(st){
var cands={};
st.forEach(function(v){if(v.type==="local-candidate"||v.type==="remote-candidate")cands[v.id]=v;});
st.forEach(function(v){
if(v.type==="candidate-pair"){
var l=cands[v.localCandidateId]||{},r=cands[v.remoteCandidateId]||{};
lines.push("pair " +(l.candidateType||"?")+ "/" +(l.protocol||"")+ " -> " +(r.candidateType||"?")+(r.address&&/\.local$/.test(r.address)? "(mdns)":"")+ " " + v.state + " req" +(v.requestsSent||0)+ " resp" +(v.responsesReceived||0));
}
});
return lines.join("\n");
},function(){return lines.join("\n");});
},
describe:function(code){
try{
var r=unpackCode(code),pub=null,local=false;
r.cands.forEach(function(c){if(c.type==="srflx")pub=c.addr;else local=true;});
return{pub:pub,local:local};
}catch(e){
return null;
}
},
check:function(code){
try{
var r=unpackCode(code);
return{ok:true,fixes:r.fixes,kind:r.kind};
}catch(e){
return{ok:false,msg:e.message};
}
},
_sdp:buildSdp,
_rs:{encode:rsEncode,correct:rsCorrect}
};

<script>
(function () {
  "use strict";
  function gameHtml() {
    var h = document.getElementById("dash-game").textContent
      .replace(/<\\\/script/gi, function (m) { return "</" + m.slice(3); })
      .replace(/<\\!--/g, "<!--");
    var sc = window.savecodeversion1point1 || window.savecode1dot1 || window.saveCode;
    var set = "";
    if (sc) set += "window.savecodeversion1point1 = " + JSON.stringify(String(sc)) + ";";
    if (window.dashServerMode) set += "window.dashServerMode = " + JSON.stringify(window.dashServerMode) + ";";
    // hand the settings from the top of this file to the game
    if (set) h = h.replace("<head>", "<head><" + "script>" + set.replace(/</g, "\\u003c") + "<" + "/script>");
    return h;
  }
  function msg(t) { document.getElementById("msg").textContent = t; }
  function playHere() {
    var h = gameHtml();
    document.open();
    document.write(h);
    document.close();
  }
  document.getElementById("open").onclick = function () {
    var w = null;
    try { w = window.open("about:blank", "_blank"); } catch (e) { w = null; }
    if (!w) { msg("Your browser blocked the new tab. Allow pop-ups for this page, or play in this page."); return; }
    try {
      w.document.open();
      w.document.write(gameHtml());
      w.document.close();
      try { w.focus(); } catch (e) {}
      msg("The game is running in the new tab.");
    } catch (e) {
      // Sandboxed pages may not reach into the new tab: hand it the game as a
      // blob: URL instead (no access to its document needed).
      try {
        var url = URL.createObjectURL(new Blob([gameHtml()], { type: "text/html" }));
        w.location.href = url;
        msg("The game is running in the new tab.");
      } catch (e2) {
        try { w.close(); } catch (e3) {}
        msg("Could not start the game in a new tab here (" + (e && e.message ? e.message : e) + "). Try playing in this page.");
      }
    }
  };
  document.getElementById("here").onclick = playHere;
  // Only a page shown inside another page (the Khan Academy editor, an
  // embed) needs the buttons: opened by itself (the file, or a website)
  // it already has the whole window, so the game just starts.
  // (Khan Academy's loop checker: a loop without { } braces makes it say
  // "Something's wrong with the HTML, but we're not sure what", and loops that
  // run long stop the page, so the launcher has no loops at all.)
  // [v1.1] The real title screen (logo, Dash, the Area 1 grid) behind the
  // buttons. Khan Academy's checker turns away pictures, so it is kept as text
  // inside the game (id="dash-launch-art") and painted here; if anything is
  // missing (an old browser), the plain start screen above stays.
  function showArt() {
    var src = document.getElementById("dash-game").textContent;
    var key = 'id="dash-launch-art">';
    var a = src.indexOf(key);
    if (a === -1 || typeof DecompressionStream === "undefined" || typeof Response === "undefined" || !window.Blob) return;
    var b = src.indexOf("\u003c", a + key.length);
    var lines = src.slice(a + key.length, b).replace(/^\s+|\s+$/g, "").split("\n");
    var size = lines[0].split(" ");
    var W = +size[0], H = +size[1];
    var b64 = lines.slice(1).join("").replace(/\s+/g, "");
    // (no loops here: Khan Academy stops a page whose loops run too long)
    var bytes = Uint8Array.fromBase64 ? Uint8Array.fromBase64(b64) : Uint8Array.from(atob(b64), function (ch) { return ch.charCodeAt(0); });
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    new Response(stream).arrayBuffer().then(function (buf) {
      if (buf.byteLength !== W * H * 4) return;
      var c = document.createElement("canvas");
      c.width = W;
      c.height = H;
      var g = c.getContext("2d");
      var img = new ImageData(new Uint8ClampedArray(buf), W, H);
      g.putImageData(img, 0, 0);
      c.id = "dash-art";
      c.setAttribute("aria-hidden", "true");
      c.style.position = "fixed";
      c.style.zIndex = "0";
      document.body.insertBefore(c, document.body.firstChild);
      // the card becomes just the buttons, between Dash and the credits
      var card = document.getElementById("card");
      ["dash", "logo", "sub"].forEach(function (id) { document.getElementById(id).style.display = "none"; });
      var small = card.querySelector(".small");
      if (small) small.style.display = "none";
      document.getElementById("open").title = small ? small.textContent : "";
      var m = document.getElementById("msg");
      m.style.minHeight = "0";
      m.style.background = "#fff";
      m.style.borderRadius = "8px";
      m.style.padding = "0 6px";
      var here = document.getElementById("here");
      here.style.background = "#fff";
      here.style.border = "3px solid #000";
      here.style.borderRadius = "12px";
      here.style.padding = "4px 12px";
      here.style.textDecoration = "none";
      var cs = card.style;
      cs.position = "fixed";
      cs.zIndex = "1";
      cs.left = "50%";
      cs.background = "transparent";
      cs.border = "0";
      cs.boxShadow = "none";
      cs.padding = "0";
      cs.maxWidth = "none";
      cs.transformOrigin = "50% 0";
      cs.whiteSpace = "nowrap";
      function place() {
        var vw = window.innerWidth, vh = window.innerHeight;
        var s = Math.max(vw / W, vh / H);
        c.style.width = Math.ceil(W * s) + "px";
        c.style.height = Math.ceil(H * s) + "px";
        c.style.left = Math.round((vw - W * s) / 2) + "px";
        c.style.top = Math.round((vh - H * s) / 2) + "px";
        // room under Dash, above "DIGITSOFPI AND KINETO" (picture rows 488 to 674 of 720)
        var top = vh / 2 + (488 - H / 2) * s, bottom = vh / 2 + (674 - H / 2) * s;
        cs.transform = "translate(-50%, 0)";
        var k = Math.min(1, (bottom - top) / Math.max(1, card.offsetHeight), (vw - 16) / Math.max(1, card.offsetWidth));
        cs.transform = "translate(-50%, 0) scale(" + k + ")";
        cs.top = Math.round(top + (bottom - top - card.offsetHeight * k) / 2) + "px";
      }
      place();
      window.addEventListener("resize", place);
      new MutationObserver(place).observe(m, { childList: true, characterData: true, subtree: true });
    }, function () {});
  }
  var framed = true;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (!framed) playHere();
  else try { showArt(); } catch (e) {}
}());
</script>
