function dkIsFiniteNumber(value){
return typeof value==="number"&&
value===value&&
value<(1 / 0)&&
value>(-1 / 0);
}
function dkIsInteger(value){
return dkIsFiniteNumber(value)&&
Math.floor(value)===value;
}
function dkThrow(message){

function dkNewByteArray(length){
var bytes=[];
var index;
for(index=0;index<length;index++){
bytes[index]=0;
}
return bytes;
}
var DK_ALPHABET="!#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_abcdefghijklmnopqrstuvwxyz{|}~ĀāĂăĄąĆćĈĉĊċČčĎďĐđĒēĔĕĖėĘęĚěĜĝĞğĠġĢģĤĥĦħĨĩĪīĬĭĮįİıĲĳĴĵĶķĸĹĺĻļĽľĿŀŁłŃńŅņŇňŉŊŋŌōŎŏŐőŒœŔŕŖŗŘřŚśŜŝŞşŠšŢţŤťŦŧŨũŪūŬ";
var DK_ALPHABET_INDEX={};
var dkAlphabetPosition;
for(dkAlphabetPosition=0;
dkAlphabetPosition<DK_ALPHABET.length;
dkAlphabetPosition++){
DK_ALPHABET_INDEX[DK_ALPHABET.charAt(dkAlphabetPosition)]=dkAlphabetPosition;
}
var DK_BASE_K_BLOCK_SIZE=4;
var DK_BASE_K_DIGIT_COUNTS=[0,2,3,4,5];
function dkNewByteArray(length){
var bytes=[];
var index;
for(index=0;index<length;index++){
bytes[index]=0;
}
return bytes;
}
function dkBaseDigitCount(byteCount){
if(byteCount<0||byteCount>=DK_BASE_K_DIGIT_COUNTS.length){
return 0;
}
return DK_BASE_K_DIGIT_COUNTS[byteCount];
}
function dkDecodeBaseK(encoded,byteLength,blockSize){
blockSize=blockSize||DK_BASE_K_BLOCK_SIZE;
if(!dkIsInteger(blockSize)||blockSize!==DK_BASE_K_BLOCK_SIZE){
dkThrow("DK: invalid Base-K block size.");
}
var output=dkNewByteArray(byteLength);
var outputOffset=0;
var inputOffset=0;
var alphabetSize=DK_ALPHABET.length;
var encodedLength=encoded.length;
while(outputOffset<byteLength){
var blockLength=byteLength - outputOffset;
if(blockLength>blockSize){
blockLength=blockSize;
}
var digitCount=DK_BASE_K_DIGIT_COUNTS[blockLength];
var endOffset=inputOffset + digitCount;
if(endOffset>encodedLength){
dkThrow("DKL: truncated base-k data.");
}
var value=0;
var i;
var digit;
var byteValue;
var divisor;
for(i=inputOffset;i<endOffset;i++){
digit=DK_ALPHABET_INDEX[encoded.charAt(i)];
if(typeof digit!=="number"){
dkThrow("DKL: invalid base-k character.");
}
value=value*alphabetSize + digit;
}
inputOffset=endOffset;
if(blockLength===4){
byteValue=Math.floor(value / 16777216);
if(byteValue>255){
dkThrow("DKL: base-k block exceeds its byte length.");
}
output[outputOffset]=byteValue;
value=value - byteValue*16777216;
output[outputOffset + 1]=Math.floor(value / 65536);
value=value%65536;
output[outputOffset + 2]=Math.floor(value / 256);
output[outputOffset + 3]=value%256;
outputOffset +=4;
}else{
divisor=1;
for(i=1;i<blockLength;i++){
divisor=divisor*256;
}
for(i=0;i<blockLength;i++){
byteValue=Math.floor(value / divisor);
if(byteValue>255){
dkThrow("DKL: base-k block exceeds its byte length.");
}
output[outputOffset]=byteValue;
outputOffset=outputOffset + 1;
value=value - byteValue*divisor;
divisor=Math.floor(divisor / 256);
}
if(value!==0){
dkThrow("DKL: base-k block exceeds its byte length.");
}
}
}
if(inputOffset!==encodedLength){
dkThrow("DKL: base-k data has trailing characters.");
}
return output;
}

<script>
(function () {
  "use strict";
  function gameHtml() {
    var h = document.getElementById("dash-game").textContent
      .replace(/<\\\/script/gi, function (m) { return "</" + m.slice(3); })
      .replace(/<\\!--/g, "<!--");
    var sc = window.savecodeversion1point1 || window.savecode1dot1 || window.saveCode;
    var set = "";
    if (sc) set += "window.savecodeversion1point1 = " + JSON.stringify(String(sc)) + ";";
    if (window.dashServerMode) set += "window.dashServerMode = " + JSON.stringify(window.dashServerMode) + ";";
    // hand the settings from the top of this file to the game
    if (set) h = h.replace("<head>", "<head><" + "script>" + set.replace(/</g, "\\u003c") + "<" + "/script>");
    return h;
  }
  function msg(t) { document.getElementById("msg").textContent = t; }
  function playHere() {
    var h = gameHtml();
    document.open();
    document.write(h);
    document.close();
  }
  document.getElementById("open").onclick = function () {
    var w = null;
    try { w = window.open("about:blank", "_blank"); } catch (e) { w = null; }
    if (!w) { msg("Your browser blocked the new tab. Allow pop-ups for this page, or play in this page."); return; }
    try {
      w.document.open();
      w.document.write(gameHtml());
      w.document.close();
      try { w.focus(); } catch (e) {}
      msg("The game is running in the new tab.");
    } catch (e) {
      // Sandboxed pages may not reach into the new tab: hand it the game as a
      // blob: URL instead (no access to its document needed).
      try {
        var url = URL.createObjectURL(new Blob([gameHtml()], { type: "text/html" }));
        w.location.href = url;
        msg("The game is running in the new tab.");
      } catch (e2) {
        try { w.close(); } catch (e3) {}
        msg("Could not start the game in a new tab here (" + (e && e.message ? e.message : e) + "). Try playing in this page.");
      }
    }
  };
  document.getElementById("here").onclick = playHere;

  // (Khan Academy's loop checker: a loop without { } braces makes it say
  // "Something's wrong with the HTML, but we're not sure what", and loops that
  // run long stop the page, so the launcher has no loops at all.)
  // [v1.1] The real title screen (logo, Dash, the Area 1 grid) behind the
  // buttons. Khan Academy's checker turns away pictures, so it is kept as text
  // inside the game (id="dash-launch-art") and painted here; if anything is
  // missing (an old browser), the plain start screen above stays.
  function showArt() {
    var src = document.getElementById("dash-game").textContent;
    var key = 'id="dash-launch-art">';
    var a = src.indexOf(key);
    if (a === -1 || typeof DecompressionStream === "undefined" || typeof Response === "undefined" || !window.Blob) return;
    var b = src.indexOf("\u003c", a + key.length);
    var lines = src.slice(a + key.length, b).replace(/^\s+|\s+$/g, "").split("\n");
    var size = lines[0].split(" ");
    var W = +size[0], H = +size[1];
    var b64 = lines.slice(1).join("").replace(/\s+/g, "");
    // (no loops here: Khan Academy stops a page whose loops run too long)
    var bytes = Uint8Array.fromBase64 ? Uint8Array.fromBase64(b64) : Uint8Array.from(atob(b64), function (ch) { return ch.charCodeAt(0); });
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    new Response(stream).arrayBuffer().then(function (buf) {
      if (buf.byteLength !== W * H * 4) return;
      var c = document.createElement("canvas");
      c.width = W;
      c.height = H;
      var g = c.getContext("2d");
      var img = new ImageData(new Uint8ClampedArray(buf), W, H);
      g.putImageData(img, 0, 0);
      c.id = "dash-art";
      c.setAttribute("aria-hidden", "true");
      c.style.position = "fixed";
      c.style.zIndex = "0";
      document.body.insertBefore(c, document.body.firstChild);
      // the card becomes just the buttons, between Dash and the credits
      var card = document.getElementById("card");
      ["dash", "logo", "sub"].forEach(function (id) { document.getElementById(id).style.display = "none"; });
      var small = card.querySelector(".small");
      if (small) small.style.display = "none";
      document.getElementById("open").title = small ? small.textContent : "";
      var m = document.getElementById("msg");
      m.style.minHeight = "0";
      m.style.background = "#fff";
      m.style.borderRadius = "8px";
      m.style.padding = "0 6px";
      var here = document.getElementById("here");
      here.style.background = "#fff";
      here.style.border = "3px solid #000";
      here.style.borderRadius = "12px";
      here.style.padding = "4px 12px";
      here.style.textDecoration = "none";
      var cs = card.style;
      cs.position = "fixed";
      cs.zIndex = "1";
      cs.left = "50%";
      cs.background = "transparent";
      cs.border = "0";
      cs.boxShadow = "none";
      cs.padding = "0";
      cs.maxWidth = "none";
      cs.transformOrigin = "50% 0";
      cs.whiteSpace = "nowrap";
      function place() {
        var vw = window.innerWidth, vh = window.innerHeight;
        var s = Math.max(vw / W, vh / H);
        c.style.width = Math.ceil(W * s) + "px";
        c.style.height = Math.ceil(H * s) + "px";
        c.style.left = Math.round((vw - W * s) / 2) + "px";
        c.style.top = Math.round((vh - H * s) / 2) + "px";
        // room under Dash, above "DIGITSOFPI AND KINETO" (picture rows 488 to 674 of 720)
        var top = vh / 2 + (488 - H / 2) * s, bottom = vh / 2 + (674 - H / 2) * s;
        cs.transform = "translate(-50%, 0)";
        var k = Math.min(1, (bottom - top) / Math.max(1, card.offsetHeight), (vw - 16) / Math.max(1, card.offsetWidth));
        cs.transform = "translate(-50%, 0) scale(" + k + ")";
        cs.top = Math.round(top + (bottom - top - card.offsetHeight * k) / 2) + "px";
      }
      place();
      window.addEventListener("resize", place);
      new MutationObserver(place).observe(m, { childList: true, characterData: true, subtree: true });
    }, function () {});
  }
  var framed = true;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  // ([v1.1] after the page has finished loading: started while it was still
  // loading, iPhones and iPads stopped before the game began)
  if (!framed) {
    if (document.readyState === "complete") setTimeout(playHere, 0);
    else window.addEventListener("load", function () { setTimeout(playHere, 0); });
  }
  else try { showArt(); } catch (e) {}
}());
</script>
</body>
</html>
