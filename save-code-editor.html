<!DOCTYPE html><!--hi-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Code Editor</title>
    <style>
        :root {
            --bg-primary: #121214;
            --bg-secondary: #1a1a1e;
            --bg-tertiary: #26262b;
            --accent: #00ff66;
            --accent-hover: #00cc52;
            --text-main: #e2e2e9;
            --text-muted: #8a8a93;
            --border: #33333a;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 25px;
        }
        
        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
        }
        
        p.subtitle {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        /* Save Code Box */
        .save-code-section {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .save-input-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        
        input[type="text"] {
            flex-grow: 1;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
            color: #fff;
            font-family: monospace;
            font-size: 1.1rem;
        }
        
        button {
            cursor: pointer;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 4px;
            border: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        
        .btn-primary {
            background-color: var(--accent);
            color: #000;
        }
        
        .btn-primary:hover {
            background-color: var(--accent-hover);
        }
        
        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background-color: #323239;
        }
        
        /* Editor Layout */
        .editor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .section-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        
        .section-card h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            color: var(--accent);
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        
        /* Form elements */
        .field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1f1f23;
        }
        
        .field-row:last-child {
            border-bottom: none;
        }
        
        label {
            font-size: 0.95rem;
            color: var(--text-main);
        }
        
        .field-row input[type="number"] {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px;
            color: #fff;
            width: 80px;
            text-align: right;
        }
        
        /* Toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-tertiary);
            transition: .3s;
            border-radius: 22px;
            border: 1px solid var(--border);
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: .3s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: rgba(0, 255, 102, 0.2);
            border-color: var(--accent);
        }
        
        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: var(--accent);
        }
        
        /* Speedrun Grid Styling */
        .speedruns-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        
        .speedrun-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px;
        }
        
        .speedrun-cell label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: bold;
        }
        
        .speedrun-cell input {
            width: 90%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: #fff;
            text-align: center;
            font-family: monospace;
            font-size: 0.85rem;
        }
        
        .speedrun-cell input:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }
        
        .status-msg {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .success { color: var(--accent); }
        .error { color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DASH Save Editor & Tester</h1>
        <p class="subtitle">For Digitsofpi & Kineto's eyes only</p>
    </header>

    <div class="save-code-section">
        <label style="font-weight: bold; color: var(--accent);">Active Save Code</label>
        <div class="save-input-group">
            <input type="text" id="saveCodeDisplay" placeholder="Enter save code here to load, or make changes below to generate...">
            <button class="btn-primary" onclick="generateSave()">Generate</button>
            <button class="btn-secondary" onclick="decodeSave()">Decode</button>
        </div>
        <div id="statusMessage" class="status-msg"></div>
    </div>

    <div class="editor-grid">
        
        <!-- SETTINGS -->
        <div class="section-card">
            <h2>Settings</h2>
            <div id="settingsContainer"></div>
        </div>

        <!-- PROGRESSION -->
        <div class="section-card">
            <h2>Progression & Stats</h2>
            <div id="progressionContainer">
                <div class="field-row">
                    <label for="val-lvlUnlock">Unlocked Level</label>
                    <input type="number" id="val-lvlUnlock" min="1" max="100">
                </div>
                <div class="field-row">
                    <label for="val-currentSkin">Equipped Skin ID</label>
                    <input type="number" id="val-currentSkin" min="0" max="21">
                </div>
                <div class="field-row">
                    <label for="val-vouchers">Voucher Balance</label>
                    <input type="number" id="val-vouchers" min="0">
                </div>
                <!-- GLOBAL DEATHS FIELD ROW -->
                <div class="field-row" style="border-top: 2px solid var(--border); margin-top: 8px; padding-top: 12px;">
                    <label for="val-deaths">Global Deaths</label>
                    <input type="number" id="val-deaths" min="0" value="0">
                </div>
            </div>
            
            <h2 style="margin-top: 25px;">Area Unlocks</h2>
            <div id="areasContainer"></div>
        </div>

        <!-- SKINS -->
        <div class="section-card">
            <h2>Skins Inventory</h2>
            <div id="skinsContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        </div>

        <!-- ACHIEVEMENTS -->
        <div class="section-card">
            <h2>Achievements & Trophies</h2>
            <div id="achievementsContainer"></div>
        </div>

        <!-- SPEEDRUN PB TIMES -->
        <div class="section-card" style="grid-column: 1 / -1;">
            <h2>Personal Best Speedrun Times</h2>
            <p class="subtitle" style="margin-bottom: 15px;">Input raw frames. Blank or 0 indicates uncompleted levels.</p>
            <div id="speedrunsContainer" class="speedruns-grid"></div>
        </div>

    </div>
</div>

<script>
var CHARS = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!#$%&()*+,-./:;<=>?@[]^_`{|}~";
var BASE = CHARS.length;
var LENCHARS = "";
for(var i = 0; i < CHARS.length; i++){
    if(CHARS[i] !== "u"){ LENCHARS += CHARS[i]; }
}

var SKIN_NAMES = [
    "Dash Skin",                // ID 0
    "Classic Skin",             // ID 1
    "Chef Costume",             // ID 2
    "Minecraft Block",          // ID 3
    "Sphere Costume",           // ID 4
    "Tower Dash",               // ID 5
    "Boing Costume",            // ID 6
    "Scary Larry",              // ID 7
    "Warrior Costume",          // ID 8
    "8-bit Dash",               // ID 9
    "Multi Platform Dash",      // ID 10
    "Dino Dash",                // ID 11
    "Zapp Costume",             // ID 12
    "Ninja Costume",            // ID 13
    "Mario Costume",            // ID 14
    "Maze Dash",                // ID 15
    "ECH0 Costume",             // ID 16
    "Dash Brainrot",            // ID 17
    "Kineto Costume",           // ID 18
    "Digitsofpi Costume",       // ID 19
    "Champion Dash",            // ID 20
    "Parkour Master Costume"    // ID 21
];

var makeCheck = function(str){
    var a = 1; var b = 7;
    for(var i = 0; i < str.length; i++){
        var c = str.charCodeAt(i);
        a = (a * 31 + c) % BASE;
        b = (b * 17 + c) % BASE;
    }
    return CHARS[a] + CHARS[b];
};

var encodeUnsigned = function(n){
    if(n === 0){ return LENCHARS[0] + CHARS[0]; }
    var out = "";
    while(n > 0){
        out = CHARS[n % BASE] + out;
        n = Math.floor(n / BASE);
    }
    return LENCHARS[out.length - 1] + out;
};

var decodeUnsignedAt = function(str, pos){
    if(pos >= str.length){ return null; }
    var len = LENCHARS.indexOf(str[pos]);
    if(len < 0){ return null; }
    len += 1;
    if(pos + 1 + len > str.length){ return null; }
    var n = 0;
    for(var i = 0; i < len; i++){
        var idx = CHARS.indexOf(str[pos + 1 + i]);
        if(idx < 0){ return null; }
        n *= BASE; n += idx;
    }
    return { value: n, next: pos + 1 + len };
};

var zigzagEncode = function(n){
    return n >= 0 ? n * 2 : (-n * 2) - 1;
};

var zigzagDecode = function(n){
    return n % 2 === 0 ? n / 2 : -((n + 1) / 2);
};

var encodeInt = function(n){
    return encodeUnsigned(zigzagEncode(n));
};

var decodeIntAt = function(str, pos){
    var r = decodeUnsignedAt(str, pos);
    if(r === null){ return null; }
    return { value: zigzagDecode(r.value), next: r.next };
};

var scaleFromTemplate = function(v){
    var s = "" + v;
    if(s.indexOf("e") !== -1 || s.indexOf("E") !== -1){ s = v.toFixed(10); }
    var dot = s.indexOf(".");
    if(dot === -1){ return 1; }
    var places = s.length - dot - 1;
    var m = 1;
    for(var i = 0; i < places; i++){ m *= 10; }
    return m;
};

var toScaledInt = function(v, scale){ return Math.round(v * scale); };
var fromScaledInt = function(v, scale){ return v / scale; };

// Exact replica template structure mapped cleanly to JS Engine definitions
var SAVE_TEMPLATE = {
    // Achievements
    startingSmall: false, greenMeansGo: false, nonStop: false, parkourChampion: false,
    lightwork: false, twentyTwo: false, trueDedication: false, parkourMaster: false,
    hotStuff: false, pointy: false, bottomless: false, fallingAnvil: false,
    electrifying: false, poisonous: false, reallyPointy: false, backForMore: false,
    oneOfMany: false, tenOfMany: false, hundredOfMany: false, pixelPerfect: false,
    soLong: false,
    
    // Settings
    generalSetting: false, instantRespawn: false, darkMode: false,
    sceneTransitions: true, fancyGraphics: true, particles: true,
    soundEffects: true, playMusic: true,
    
    // Inventory - Skins (Match default owned properties)
    skin_0: true, skin_1: false, skin_2: false, skin_3: false, skin_4: false,
    skin_5: false, skin_6: false, skin_7: false, skin_8: false, skin_9: false,
    skin_10: false, skin_11: false, skin_12: false, skin_13: false, skin_14: false,
    skin_15: false, skin_16: false, skin_17: false, skin_18: false, skin_19: false,
    skin_20: true, skin_21: false,
    
    // Progression Numbers
    lvlUnlock: 1,
    currentSkin: 0,
    vouchers: 0,
    deaths: 0, // Integrated!
    
    // Stage Unlocks
    area2Unlocked: false,
    area3Unlocked: false,
    areaXUnlocked: false,
    allAreasComplete: false,
    allRunsComplete: false,
    
    // Speedruns
    speedruns: ""
};

// Build Engine Instantiation with split-mask safety handling
var Save = (function(template){
    var keys = []; var kinds = []; var scales = [];
    for(var k in template){
        if(!template.hasOwnProperty(k)){ continue; }
        keys.push(k);
        var v = template[k];
        if(typeof v === "boolean"){
            kinds.push("b"); scales.push(1);
        } else if(typeof v === "number"){
            kinds.push("n"); scales.push(scaleFromTemplate(v));
        } else if(typeof v === "string"){
            kinds.push("s"); scales.push(1);
        } else {
            kinds.push("n"); scales.push(1);
        }
    }

    return {
        keys: keys,
        kinds: kinds,
        scales: scales,
        save: function(obj){
            var boolMask1 = 0; // Flags 0 to 27
            var boolMask2 = 0; // Flags 28 to 55
            var boolIndex = 0;
            
            for(var i = 0; i < keys.length; i++){
                if(kinds[i] === "b"){
                    if(obj[keys[i]]){
                        if (boolIndex < 28) {
                            boolMask1 += Math.pow(2, boolIndex);
                        } else {
                            boolMask2 += Math.pow(2, boolIndex - 28);
                        }
                    }
                    boolIndex++;
                }
            }
            
            // Build body using consecutive double-mask splits
            var body = encodeInt(boolMask1) + encodeInt(boolMask2);
            
            for(var j = 0; j < keys.length; j++){
                var kind = kinds[j]; var key = keys[j];
                if(kind === "b") continue;
                if(kind === "s"){
                    var rawStr = obj[key] || "";
                    body += encodeInt(rawStr.length) + rawStr;
                    continue;
                }
                var scale = scales[j];
                var raw = obj[key] === undefined || obj[key] === null ? 0 : obj[key];
                raw = toScaledInt(raw, scale);
                body += encodeInt(raw);
            }
            return body + makeCheck(body);
        },
        load: function(str){
            if(str.length < 3) return null;
            var expected = str.substring(str.length - 2);
            var body = str.substring(0, str.length - 2);
            if(makeCheck(body) !== expected) return null;
            var pos = 0;
            
            // Decode mask 1
            var first = decodeIntAt(body, pos);
            if(first === null) return null;
            var boolMask1 = first.value; pos = first.next;
            
            // Decode mask 2
            var second = decodeIntAt(body, pos);
            if(second === null) return null;
            var boolMask2 = second.value; pos = second.next;
            
            var out = {}; var boolIndex = 0;
            for(var i = 0; i < keys.length; i++){
                if(kinds[i] === "b"){
                    if (boolIndex < 28) {
                        out[keys[i]] = Math.floor(boolMask1 / Math.pow(2, boolIndex)) % 2 === 1;
                    } else {
                        out[keys[i]] = Math.floor(boolMask2 / Math.pow(2, boolIndex - 28)) % 2 === 1;
                    }
                    boolIndex++;
                    continue;
                }
                if(kinds[i] === "s"){
                    var rLen = decodeIntAt(body, pos);
                    if(rLen === null) return null;
                    var len = rLen.value; pos = rLen.next;
                    if(pos + len > body.length) return null;
                    out[keys[i]] = body.substring(pos, pos + len);
                    pos += len;
                    continue;
                }
                var r = decodeIntAt(body, pos);
                if(r === null) return null;
                out[keys[i]] = fromScaledInt(r.value, scales[i]);
                pos = r.next;
            }
            return pos === body.length ? out : null;
        }
    };
})(SAVE_TEMPLATE);


function buildUI() {
    var settingsDiv = document.getElementById("settingsContainer");
    var skinsDiv = document.getElementById("skinsContainer");
    var achDiv = document.getElementById("achievementsContainer");
    var areasDiv = document.getElementById("areasContainer");
    var speedrunsDiv = document.getElementById("speedrunsContainer");

    // Dynamic checkboxes for Boolean states
    Save.keys.forEach(function(key, idx) {
        if (Save.kinds[idx] !== "b") return;

        var val = SAVE_TEMPLATE[key];
        var row = document.createElement("div");
        row.className = "field-row";
        
        var label = document.createElement("label");
        label.htmlFor = "opt-" + key;
        
        // Inject Skin names dynamically from array or fall back to default formatted key label
        if (key.indexOf("skin_") === 0) {
            var skinId = parseInt(key.split("_")[1], 10);
            label.innerText = SKIN_NAMES[skinId] || formatLabel(key);
        } else {
            label.innerText = formatLabel(key);
        }
        
        var toggle = document.createElement("label");
        toggle.className = "switch";
        toggle.innerHTML = '<input type="checkbox" id="opt-' + key + '"' + (val ? ' checked' : '') + '><span class="slider"></span>';
        
        row.appendChild(label);
        row.appendChild(toggle);

        if (key.indexOf("skin_") === 0) {
            skinsDiv.appendChild(row);
        } else if (key.toLowerCase().indexOf("area") !== -1 || key.indexOf("all") === 0) {
            areasDiv.appendChild(row);
        } else if (key === "generalSetting" || key === "instantRespawn" || key === "darkMode" || 
                   key === "sceneTransitions" || key === "fancyGraphics" || key === "particles" || 
                   key === "soundEffects" || key === "playMusic") {
            settingsDiv.appendChild(row);
        } else {
            achDiv.appendChild(row);
        }
    });

    // Dynamic generation of 22 visual speedrun grid slot cells
    for (var l = 1; l <= 22; l++) {
        var cell = document.createElement("div");
        cell.className = "speedrun-cell";
        
        var label = document.createElement("label");
        label.innerText = "Lvl " + l;
        
        var input = document.createElement("input");
        input.type = "number";
        input.id = "time-lvl-" + l;
        input.placeholder = "—";
        input.min = "0";

        cell.appendChild(label);
        cell.appendChild(input);
        speedrunsDiv.appendChild(cell);
    }

    // Populate initial default progression field inputs
    document.getElementById("val-lvlUnlock").value = SAVE_TEMPLATE.lvlUnlock;
    document.getElementById("val-currentSkin").value = SAVE_TEMPLATE.currentSkin;
    document.getElementById("val-vouchers").value = SAVE_TEMPLATE.vouchers;
    document.getElementById("val-deaths").value = SAVE_TEMPLATE.deaths;
}

function formatLabel(str) {
    var clean = str.replace(/_/g, ' ');
    // Insert spaces before capital letters (e.g. areaXUnlocked -> area X Unlocked)
    clean = clean.replace(/([A-Z])/g, ' $1');
    // Insert spaces between numbers and letters (e.g. area2Unlocked -> Area 2 Unlocked)
    clean = clean.replace(/([a-zA-Z])([0-9])/g, '$1 $2');
    clean = clean.replace(/([0-9])([a-zA-Z])/g, '$1 $2');
    return clean.charAt(0).toUpperCase() + clean.slice(1);
}

// Read states from UI (including packing speedruns into a Base-36 string)
function readUI() {
    var data = {};
    Save.keys.forEach(function(key, idx) {
        if (Save.kinds[idx] === "b") {
            data[key] = document.getElementById("opt-" + key).checked;
        } else if (Save.kinds[idx] === "n") {
            data[key] = parseInt(document.getElementById("val-" + key).value, 10) || 0;
        }
    });

    // Handle speedrun compression parsing
    var rawTimes = [];
    for (var l = 1; l <= 22; l++) {
        var rawTimeVal = parseInt(document.getElementById("time-lvl-" + l).value, 10) || 0;
        rawTimes.push(rawTimeVal);
    }

    // Trim trailing zeroes to prevent bloating the save code
    while (rawTimes.length > 0 && rawTimes[rawTimes.length - 1] === 0) {
        rawTimes.pop();
    }

    // Map numbers to base-36 representation
    var packedSpeedruns = rawTimes.map(function(t) {
        return (!t || t === 0) ? "0" : Math.round(t).toString(36);
    }).join("-");

    data["speedruns"] = packedSpeedruns;
    return data;
}

// Write loaded state objects back into the UI (including unpacking the speedruns string)
function writeUI(data) {
    Save.keys.forEach(function(key, idx) {
        if (Save.kinds[idx] === "b") {
            document.getElementById("opt-" + key).checked = !!data[key];
        } else if (Save.kinds[idx] === "n") {
            document.getElementById("val-" + key).value = data[key];
        }
    });

    // Handle speedrun decompression parsing
    var packed = data["speedruns"] || "";
    var parts = packed ? packed.split("-") : [];

    for (var l = 1; l <= 22; l++) {
        var inputField = document.getElementById("time-lvl-" + l);
        if (l <= parts.length) {
            var valPart = parts[l - 1];
            inputField.value = (valPart === "0" || !valPart) ? "" : parseInt(valPart, 36);
        } else {
            inputField.value = "";
        }
    }
}

function showStatus(text, isError) {
    var stat = document.getElementById("statusMessage");
    stat.className = "status-msg " + (isError ? "error" : "success");
    stat.innerText = text;
}

function generateSave() {
    try {
        var data = readUI();
        var code = Save.save(data);
        document.getElementById("saveCodeDisplay").value = code;
        showStatus("New Save Code Generated Successfully", false);
    } catch(e) {
        showStatus("Generation Failed: " + e.message, true);
    }
}

function decodeSave() {
    var code = document.getElementById("saveCodeDisplay").value.trim();
    if (!code) {
        showStatus("Please paste a Save Code first!", true);
        return;
    }

    var decoded = Save.load(code);
    if (decoded === null) {
        showStatus("Save Code Decryption Failed (Typo, wrong template or checksum mismatch)!", true);
    } else {
        writeUI(decoded);
        showStatus("Save Decoded Successfully. UI values updated.", false);
    }
}

// Initialize on page load
buildUI();
</script>

</body>
</html>
